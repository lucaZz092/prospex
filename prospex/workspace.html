<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="auth.css">

<body>
<div class="ws">
  <aside class="side" id="side">
    <a href="index.html" class="logo"><span class="logo-mark">P</span>Prospex</a>
    <a href="app.html" class="btn btn-primary side-cta">＋ Nova prospecção</a>
    <nav class="menu" id="menu">
      <a href="#inicio" data-r="inicio">🏠 Início</a>
      <a href="#prospeccoes" data-r="prospeccoes">📡 Minhas prospecções <span class="ct" id="ctOrders">4</span></a>
      <a href="#leads" data-r="leads">📇 Leads</a>
      <a href="#pipeline" data-r="pipeline">🧲 Pipeline</a>

    </header>
    <main id="page"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="supa.js"></script>
<script src="workspace.js"></script>
